{% extends "base.html" %}

{% block content %}
<div class="card" style="text-align: center; padding: 3rem 1.5rem; background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%); background-image: radial-gradient(circle at top right, rgba(139, 92, 246, 0.25), transparent 60%), radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.15), transparent 50%); border: 1px solid rgba(255, 255, 255, 0.08); color: #FFFFFF; margin-bottom: 2rem;">
    <h2 style="font-size: 2.4rem; font-weight: 900; margin-bottom: 0.5rem; letter-spacing: -0.5px;">Каталог треков</h2>
    <p style="color: #94A3B8; font-size: 1rem; max-width: 500px; margin: 0 auto;">Выбирай любую тему и прокачивай свои практические навыки программирования на Python.</p>
</div>

<style>
    .tracks-adaptive-grid {
        display: flex;
        flex-direction: column;
        gap: 1.2rem;
        width: 100%;
    }

    .track-item-card {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 1.5rem;
        background: var(--surface-white);
        border: 1px solid var(--border-light);
        border-radius: 24px;
        text-decoration: none;
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease;
        box-sizing: border-box;
        max-width: 100%;
    }

    .track-item-card:hover {
        transform: translateY(-3px);
        border-color: var(--sky-blue);
        box-shadow: var(--shadow-md);
    }

    .track-avatar-box {
        font-size: 2.5rem;
        padding: 1rem;
        border-radius: 20px;
        min-width: 76px;
        height: 76px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 0.3s ease;
    }

    .track-item-card:hover .track-avatar-box {
        transform: scale(1.05) rotate(5deg);
    }

    .track-main-info {
        flex: 1;
        min-width: 0;
    }

    .track-title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
        gap: 0.8rem;
    }

    .track-headline-text {
        color: var(--text-dark);
        margin: 0;
        font-size: 1.25rem;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .track-level-tag {
        font-size: 0.75rem;
        font-weight: 700;
        background: var(--bg-milky);
        padding: 0.3rem 0.75rem;
        border-radius: 10px;
        border: 1px solid var(--border-light);
        color: var(--text-gray);
        flex-shrink: 0;
    }

    .track-desc-paragraph {
        color: var(--text-gray);
        font-size: 0.95rem;
        margin: 0 0 1rem 0;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .track-progress-container {
        background: var(--border-light);
        height: 8px;
        border-radius: 4px;
        overflow: hidden;
        width: 100%;
    }

    .track-progress-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (max-width: 650px) {
        .track-item-card { flex-direction: column; align-items: flex-start; padding: 1.2rem; gap: 1rem; }
        .track-avatar-box { width: 60px; height: 60px; font-size: 2rem; min-width: 60px; padding: 0.5rem; }
        .track-title-row { flex-wrap: wrap; gap: 0.4rem; }
        .track-headline-text { font-size: 1.15rem; }
    }
</style>

<div class="tracks-adaptive-grid">
    {% for track in tracks %}
    <a href="{{ url_for('track_detail', track_id=track.id) }}" class="track-item-card">
        <div class="track-avatar-box" style="background-color: {{ track.color }}15;">
            {{ track.icon }}
        </div>
        <div class="track-main-info">
            <div class="track-title-row">
                <h3 class="track-headline-text">{{ track.title }}</h3>
                <span class="track-level-tag">{{ track.level }}</span>
            </div>
            <p class="track-desc-paragraph">{{ track.subtitle }}</p>
            
            <div class="track-progress-container">
                <div class="track-progress-fill" style="background-color: {{ track.color }}; width: {{ progress[track.id].percent }}%;"></div>
            </div>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
